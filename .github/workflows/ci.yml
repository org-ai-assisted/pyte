name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Python ${{ matrix.python-version }}"
    ## CI runs only where we enabled it (org variable). Unset upstream / on a
    ## fork -> skipped, no runner, run stays green.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # pypy-3.10 dropped: a transitive Rust build dependency (pyo3-ffi 0.29)
        # requires PyPy 3.11+, so the wheel build fails at install time.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
            python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: |
          set -xe
          python -m pip install uv
        shell: bash
      - name: "Build"
        run: |
          set -xe
          ## style-ok: allow-python-interpreter -- log exact matrix CPython build
          python -VV
          python -m uv build --wheel --sdist
          python -m uv pip install dist/pyte*.whl
        shell: bash
      - name: "Run tests"
        run: |
          set -xe
          # Change directory to avoid importing pyte from repo root.
          pushd tests
          python -m uv run pytest -vv
          popd
        shell: bash
      - name: "Run mypy"
        run: |
          set -xe
          python -m uv run mypy pyte
        shell: bash

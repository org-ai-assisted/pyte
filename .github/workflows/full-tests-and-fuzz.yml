name: full-tests-and-fuzz

# Comprehensive public-API + property tests (tests/test_full_*.py, with
# Hypothesis) and the in-process fuzz harness (tests/fuzz_pyte.py). Runs
# alongside ci.yml; the fuzz job gates on NEW crash signatures only (known,
# already-reported defects are allowlisted in tests/known_crashes.json).

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "tests (Python ${{ matrix.python-version }})"
    ## CI runs only where we enabled it (org variable) and only for same-repo
    ## PRs, never a fork's. Unset / fork PR -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # pypy-3.10 is omitted: a transitive Rust build dependency (pyo3-ffi
        # 0.29) dropped PyPy 3.10 support (requires 3.11+), so the wheel build
        # fails at install time, unrelated to pyte or these tests.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: |
          set -xe
          python -m pip install uv
        shell: bash
      - name: "Build and install"
        run: |
          set -xe
          ## style-ok: allow-python-interpreter -- log exact matrix CPython build
          python -VV
          python -m uv build --wheel --sdist
          python -m uv pip install --system dist/pyte*.whl
        shell: bash
      - name: "Run full suite (unit + property + regression)"
        run: |
          set -xe
          # Hypothesis comes from the dev dependency-group; uv run syncs it.
          # Change directory to avoid importing pyte from the repo root.
          pushd tests
          python -m uv run pytest -vv test_full_api.py \
            test_full_regressions.py test_full_properties.py
          popd
        shell: bash

  fuzz:
    name: "fuzz (in-process)"
    ## CI runs only where we enabled it (org variable) and only for same-repo
    ## PRs, never a fork's. Unset / fork PR -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: "Install dependencies"
        run: |
          set -xe
          python -m pip install uv
        shell: bash
      - name: "Build and install"
        run: |
          set -xe
          python -m uv build --wheel
          python -m uv pip install --system dist/pyte*.whl
        shell: bash
      - name: "Fuzz Stream / ByteStream / Screen"
        run: |
          set -xe
          # Gates on new crash signatures; known defects are allowlisted in
          # tests/known_crashes.json (see BUGS/). Prints seed + sequence on a
          # new finding so it can be turned into a regression test.
          ## style-ok: allow-python-interpreter -- run under the workflow's selected python, as the surrounding uv calls do
          python tests/fuzz_pyte.py --iterations 200000
        shell: bash
